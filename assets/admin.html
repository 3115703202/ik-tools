<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>IK 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;background:#05070d;color:#eaf2ff;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 40% at 80% 10%,rgba(0,212,255,.22),transparent 60%),
  radial-gradient(50% 40% at 10% 30%,rgba(124,58,237,.20),transparent 60%),
  radial-gradient(70% 50% at 50% 100%,rgba(14,165,233,.16),transparent 65%),#05070d}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:420px;padding:26px 20px 22px;border-radius:26px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -18px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4)}
.title{font-size:17px;font-weight:600;letter-spacing:.5px;text-align:center}
.sub{font-size:12px;color:#8fa3bf;text-align:center;margin-top:8px;line-height:1.6}
.pwd{width:100%;margin-top:18px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);color:#fff;font-size:18px;text-align:center;letter-spacing:6px;outline:none}
.pwd:focus{border-color:rgba(0,212,255,.6);box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.btn{width:100%;height:48px;margin-top:14px;border:none;border-radius:14px;color:#031018;
  font-size:15px;font-weight:600;letter-spacing:1px;
  background:linear-gradient(180deg,#7fe9ff,#22c1e8);
  box-shadow:0 10px 24px rgba(0,212,255,.28),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:active{transform:translateY(1px)}
.err{color:#ff6b6b;font-size:12px;text-align:center;margin-top:10px;min-height:16px}
.wrap{padding:18px 14px 40px;display:none}
.head{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 14px}
.head h1{font-size:18px;font-weight:600}
.head .v{font-size:11px;color:#7fe9ff;background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.3);
  padding:5px 10px;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:20px;padding:14px;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.tile .k{font-size:11px;color:#8fa3bf}
.tile .v{font-size:16px;font-weight:600;margin-top:6px;word-break:break-all}
.sec{margin-top:16px;border-radius:22px;padding:16px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.sec h2{font-size:13px;color:#9fb6d4;font-weight:600;letter-spacing:.5px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.row:last-child{border-bottom:none}
.row .l{color:#c9d8ee}.row .r{color:#7fe9ff;text-align:right;word-break:break-all}
.inp{width:100%;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:13px;padding:0 12px;outline:none;margin-top:8px}
.ta{width:100%;min-height:96px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font-size:13px;padding:10px 12px;outline:none;margin-top:8px;resize:vertical;font-family:inherit}
.act{display:flex;gap:8px;margin-top:10px}
.act .a{flex:1;height:42px;border-radius:12px;border:1px solid rgba(0,212,255,.35);background:rgba(0,212,255,.14);color:#bff4ff;font-size:13px;font-weight:600}
.act .b{flex:1;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#e6f0ff;font-size:13px}
.st{font-size:11px;color:#8fa3bf;margin-top:8px;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:7px 11px;border-radius:11px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);color:#d7e6fb}
.online{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
.online b{font-size:40px;line-height:1;color:#7fe9ff;font-weight:700;text-shadow:0 0 22px rgba(0,212,255,.35)}
.online span{font-size:12px;color:#8fa3bf}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7fe9ff,#22c1e8,#7c3aed);border-radius:6px}
.foot{text-align:center;font-size:11px;color:#5c718c;margin-top:22px;line-height:1.8}
</style>
</head>
<body>
<div class="bg"></div>

<div class="gate" id="gate">
  <div class="card">
    <div class="title">管理后台</div>
    <div class="sub">本机数据控制台 · v4.5.32<br>再输一次密码才进得去</div>
    <input class="pwd" id="pwd" type="text" inputmode="numeric" autocomplete="off" placeholder="输入 10 位密码">
    <button class="btn" onclick="login()">验证进入</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="wrap" id="wrap">
  <div class="head">
    <h1>IK 管理后台</h1>
    <span class="v" id="ver">v—</span>
  </div>
  <div class="sec">
    <h2>实时在线</h2>
    <div class="online"><b id="onCount">—</b><span>人正在使用</span></div>
    <div class="st" id="onState">连接心跳中…</div>
    <div class="chips" id="onList" style="margin-top:10px"></div>
  </div>

  <div class="grid" id="tiles"></div>

  <div class="sec"><h2>设备</h2><div id="dev"></div></div>
  <div class="sec"><h2>存储</h2><div id="sto"></div><div class="bar"><i id="stoBar" style="width:0"></i></div></div>
  <div class="sec"><h2>文件分布（本 App 产物目录）</h2><div id="files"></div></div>
  <div class="sec"><h2>记录与本地服务</h2><div id="rec"></div></div>
  <div class="sec">
    <h2>公告推送（只推 App 公告）</h2>
    <div class="sub" style="text-align:left;margin:0 0 6px">所有装了 IK工具箱 的人，下次打开会在公告弹窗里看到。发布需要 GitHub Token，填一次记住。</div>
    <input class="inp" id="nTitle" placeholder="公告标题">
    <textarea class="ta" id="nBody" placeholder="公告内容（纯文字，简洁一点）"></textarea>
    <input class="inp" id="nToken" placeholder="GitHub Token（只存本机浏览器）" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="act">
      <button class="b" onclick="saveNoticeLocal()">只存本机</button>
      <button class="a" onclick="publishNotice()">发布给所有人</button>
    </div>
    <div class="st" id="nStatus"></div>
  </div>

  <div class="sec"><h2>功能清单</h2><div class="chips" id="tools"></div></div>

  <div class="foot">仅展示本机与本 App 自身数据<br>不包含任何他人隐私内容</div>
</div>

<script>
var DATA=null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function normPwd(v){
  return String(v==null?'':v)
    .replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)})
    .replace(/[^0-9]/g,'');
}
function login(){
  if(!window.AdminBridge){$('err').textContent='页面桥接未注入：请从 App 内「111」入口重新打开';return}
  var p=normPwd($('pwd').value);
  if(!p){$('err').textContent='请输入密码';return}
  var ok=false;
  try{ ok=window.AdminBridge && AdminBridge.auth(p) }catch(e){ ok=false }
  if(!ok){$('err').textContent='密码不对（收到 '+p.length+' 位数字）';return}
  var raw='{}';
  try{ raw=AdminBridge.data(p) }catch(e){ $('err').textContent='无法读取数据（请从 App 内打开）';return }
  try{ DATA=JSON.parse(raw) }catch(e){ $('err').textContent='数据解析失败';return }
  if(DATA.error){$('err').textContent='无权限：'+DATA.error;return}
  $('gate').style.display='none';
  $('wrap').style.display='block';
  render();
  fillNotice();
  startPresence();
}
function row(l,r){return '<div class="row"><span class="l">'+esc(l)+'</span><span class="r">'+esc(r)+'</span></div>'}
function render(){
  var d=DATA.device||{}, a=DATA.app||{}, s=DATA.storage||{};
  $('ver').textContent='v'+a.version+' / '+a.code;
  $('tiles').innerHTML=
    tile('功能', (DATA.tools||[]).reduce(function(n,g){return n+((g.names||[]).length)},0)+' 项')+
    tile('本机应用', a.installedApps>=0?a.installedApps+' 个':'—')+
    tile('可用空间', s.internalFree||'—')+
    tile('本机内存', (d.heapMb||'—')+' MB 堆');
  $('dev').innerHTML=
    row('品牌 / 机型', d.brand+' '+d.model)+
    row('厂商', d.manufacturer)+
    row('系统', 'Android '+d.android+' (SDK '+d.sdk+')')+
    row('架构', d.abi)+
    row('屏幕', d.screen+' @ '+d.density+'dpi')+
    row('CPU 核数', d.cores);
  $('sto').innerHTML=
    row('总容量', s.internalTotal)+
    row('已用', (s.internalUsedPct||0)+'%')+
    row('可用', s.internalFree)+
    row('App 产物占用', s.appData)+
    row('产物目录', s.outDir);
  setTimeout(function(){ $('stoBar').style.width=(s.internalUsedPct||0)+'%' },80);
  var fl=(DATA.files||[]).map(function(f){
    return row((f.dir?'📁 ':'📄 ')+f.name, f.count+' 个 · '+f.size)
  }).join('') || '<div class="row"><span class="l">暂无文件</span><span class="r">—</span></div>';
  $('files').innerHTML=fl;
  var rec=DATA.records||{};
  $('rec').innerHTML=Object.keys(rec).map(function(k){return row(k, rec[k])}).join('');
  $('tools').innerHTML=(DATA.tools||[]).map(function(g){
    return '<div style="width:100%;margin-top:8px;color:#8fa3bf;font-size:11px">'+esc(g.section)+'</div>'+
      (g.names||[]).map(function(n){return '<span class="chip">'+esc(n)+'</span>'}).join('')
  }).join('');
}
var _n={id:0,title:'',content:'',time:''};
function nStatus(t){$('nStatus').textContent=t}
function b64utf8(str){var bytes=new TextEncoder().encode(str),bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin)}
function fillNotice(){
  var n=DATA.notice||{};
  if(n.title){$('nTitle').value=n.title;$('nBody').value=n.content||'';_n=n;
    nStatus('当前线上公告：'+(n.title||'')+' · '+(n.time||''))}
  var t=localStorage.getItem('gh_token');if(t)$('nToken').value=t;
}
function saveNoticeLocal(){
  var t=$('nTitle').value.trim(),c=$('nBody').value.trim();
  if(!t||!c){nStatus('标题和正文都要填');return}
  var n={id:Date.now(),title:t,content:c,time:new Date().toLocaleString('zh-CN')};
  try{ if(AdminBridge.saveNotice(JSON.stringify(n))){ _n=n; nStatus('已存到本机，重开 App 生效') } else nStatus('保存失败') }
  catch(e){ nStatus('只能在 App 内保存') }
}
async function publishNotice(){
  var title=$('nTitle').value.trim(),body=$('nBody').value.trim();
  if(!title||!body){nStatus('标题和正文都要填');return}
  var token=String($('nToken').value||'').replace(/[\s"']/g,'');
  if(!token){nStatus('先填 GitHub Token');return}
  localStorage.setItem('gh_token',token);
  var notice={id:Date.now(),title:title,content:body,time:new Date().toLocaleString('zh-CN')};
  var api='https://api.github.com/repos/3115703202/ik-tools/contents/notice.json';
  var h={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'};
  nStatus('发布中…');
  try{
    var who=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+token}});
    if(who.status!==200){
      nStatus('Token 无效或已过期（GitHub '+who.status+'）。请到 github.com/settings/tokens 重新生成，勾选 repo 权限');
      return
    }
    var sha=null;
    var g=await fetch(api+'?ref=main',{headers:h});
    if(g.ok){sha=(await g.json()).sha}
    var payload={message:'notice: '+title,content:b64utf8(JSON.stringify(notice,null,2)),branch:'main'};
    if(sha)payload.sha=sha;
    var r=await fetch(api,{method:'PUT',headers:h,body:JSON.stringify(payload)});
    if(r.ok){ nStatus('已发布，等 Pages 构建 1-2 分钟后，用户下次打开就能收到') }
    else{ nStatus('发布失败：'+((await r.json()).message||r.status)) }
  }catch(e){ nStatus('发布出错：'+e) }
}
var seen={},presenceStarted=false;
function startPresence(){
  if(presenceStarted) return;
  presenceStarted=true;
  try{
    var es=new EventSource('https://ntfy.sh/ik_online_3115703202_9f4c/sse');
    es.onopen=function(){ $('onState').textContent='实时连接正常，每 5 秒刷新' };
    es.onerror=function(){ $('onState').textContent='连接断开，浏览器会自动重连' };
    es.onmessage=function(e){
      try{
        var m=JSON.parse(e.data);
        if(m.event!=='message') return;
        var d=JSON.parse(m.message);
        if(!d.id) return;
        seen[d.id]={t:Date.now(),model:d.model,v:d.v};
        tickPresence();
      }catch(err){}
    };
  }catch(err){ $('onState').textContent='当前环境不支持实时连接' }
  setInterval(tickPresence,5000);
}
function tickPresence(){
  var now=Date.now(),ids=Object.keys(seen),active=[];
  for(var i=0;i<ids.length;i++) if(now-seen[ids[i]].t<180000) active.push(ids[i]);
  $('onCount').textContent=active.length;
  $('onList').innerHTML=active.slice(0,12).map(function(k){
    var x=seen[k];
    return '<span class="chip">'+esc(x.model||'设备')+' · v'+esc(x.v||'?')+'</span>'
  }).join('');
}
function tile(k,v){return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&$('gate').style.display!=='none')login()});
</script>
</body>
</html>
